name: ci

# Action runtime requirement: every `uses:` below must declare `runs.using: node24`.
# Node 20 was removed from GitHub-hosted runners on 2026-09-23, so node20 majors
# (actions/checkout@v4, azure/setup-helm@v4, hashicorp/setup-terraform@v3,
# docker/*@v3, docker/build-push-action@v5) are force-run on Node 24 and emit
# "Node.js 20 is deprecated" annotations. Keep the lowest node24 major pinned here
# (docker/build-push-action switched only in v7 - v6 is still node20).
on:
  push:
    branches:
    - "*"  # run for branches
    tags:
    - "*"  # run for tags
  workflow_dispatch:  # allow manual runs

jobs:
  # ---------------------------------------------------------------------------
  # 1) complete-demo.yaml must be exactly the concatenation of manifests/*.
  #    Same check as `make check-complete-demo`, but it runs awk | diff directly
  #    instead of building a Docker image first (much faster).
  # ---------------------------------------------------------------------------
  complete-demo-sync-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Check complete-demo.yaml is in sync with manifests/
      run: |
        awk '{print}' deploy/kubernetes/manifests/* | diff deploy/kubernetes/complete-demo.yaml -
        echo "OK: complete-demo.yaml is in sync with manifests/"

  # ---------------------------------------------------------------------------
  # 2) Fast, offline schema validation of every manifest (no cluster required).
  #    Replaces the old kind-based deployment test, which spun up a full
  #    Kubernetes cluster (kindest/node:v1.20.0) and regularly timed out on CI
  #    runners, because starting that old cluster + pulling all images took
  #    longer than the job's 10 minute limit.
  #
  #    ALL directories that hold applyable manifests are checked, not just
  #    manifests/: a typo in the logging/monitoring/alerting stacks would
  #    otherwise only surface at deploy time. Two things are deliberately left
  #    out: legacy/ directories (archived, non-applyable API versions kept for
  #    history) and helm-chart/ (rendered + validated by helm-chart-validate).
  # ---------------------------------------------------------------------------
  manifests-validate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Validate manifests (kubeconform -strict)
      run: |
        docker run --rm -v "$PWD:/work" ghcr.io/yannh/kubeconform:latest \
          -strict -summary -ignore-missing-schemas \
          -ignore-filename-pattern '.*/legacy/.*' \
          /work/deploy/kubernetes/manifests \
          /work/deploy/kubernetes/complete-demo.yaml \
          /work/deploy/kubernetes/manifests-logging \
          /work/deploy/kubernetes/manifests-jaeger \
          /work/deploy/kubernetes/manifests-monitoring \
          /work/deploy/kubernetes/manifests-alerting \
          /work/deploy/kubernetes/manifests-loadtest \
          /work/deploy/kubernetes/manifests-policy \
          /work/deploy/kubernetes/autoscaling
    # The Prometheus rules are NOT Kubernetes manifests (no apiVersion/kind:
    # they are a rule file, embedded in a ConfigMap data key), so kubeconform
    # cannot see them. That is exactly why a broken rule is dangerous here:
    # Prometheus treats a malformed rule file as NON-fatal - it logs an error
    # and keeps running WITHOUT those alerts. A silent monitoring gap is worse
    # than a crash, and promtool is the only thing that catches a bad PromQL
    # expression or a broken rule structure before it is applied.
    - name: Validate Prometheus rules (promtool)
      run: |
        docker run --rm -e RULES_KEY=alert.rules -v "$PWD:/work" mikefarah/yq:4.44.3 \
          eval -r '.data[env(RULES_KEY)]' \
          /work/deploy/kubernetes/manifests-monitoring/05-prometheus-alertrules.yaml > alert.rules
        docker run --rm -v "$PWD:/work" --entrypoint promtool \
          prom/prometheus:v2.45.6 check rules /work/alert.rules

    # The Grafana access problem (FIXES.md, section 12) is not a schema error, so
    # kubeconform cannot see its three comebacks: a literal credential in a
    # manifest, Grafana published on a host port again, and a FOLDED YAML block
    # (">") for the import Job's shell script - folded blocks join lines with
    # spaces, so "fi" + "done" become "fidone" and a "#" comment swallows the
    # rest of the script, while the Job still reports Completed.
    # legacy/ is deliberately out of scope (archived, non-applyable).
    - name: Guard Grafana access (no literal creds, ClusterIP, literal shell block)
      run: |
        set -eu
        mon=deploy/kubernetes/manifests-monitoring

        # 1) No literal credential on an active (non-comment) line.
        if grep -nE 'admin:admin|admin:[A-Za-z0-9._-]+@' "$mon"/*.yaml \
             | grep -vE ':[0-9]+:[[:space:]]*#'; then
          echo "::error::a default Grafana credential is back in a manifest"
          exit 1
        fi

        # 2) GF_SECURITY_ADMIN_* must be fed from the Secret, never inline: the
        #    env entry has to be followed by valueFrom, not by value.
        awk '
          /name: *GF_SECURITY_ADMIN_(USER|PASSWORD)/  { want = NR + 1; next }
          want && NR == want {
            if ($0 !~ /valueFrom/) {
              print "::error::" FILENAME ":" NR ": literal value instead of secretKeyRef: " $0
              bad = 1
            }
            want = 0
          }
          END { exit bad }
        ' "$mon"/*.yaml

        # 3) Grafana stays a ClusterIP Service reached through the Ingress.
        #    Both patterns are anchored to a YAML field ("  nodePort:"), so a
        #    comment that merely mentions the old NodePort cannot trip them.
        grep -qE '^[[:space:]]*type:[[:space:]]*ClusterIP' "$mon/22-grafana-svc.yaml"
        if grep -nE '^[[:space:]]*nodePort:' "$mon/22-grafana-svc.yaml"; then
          echo "::error::the Grafana Service is published on a host port again"
          exit 1
        fi
        grep -qE '^[[:space:]]*kind:[[:space:]]*Ingress' "$mon/30-grafana-ingress.yaml"

        # 4) The import Job keeps LITERAL shell blocks.
        if grep -nE '^[[:space:]]*-[[:space:]]+>[[:space:]]*$' "$mon/23-grafana-import-dash-batch.yaml"; then
          echo "::error::the import Job uses a folded block (>) - fi+done would become fidone"
          exit 1
        fi
        grep -qE '^[[:space:]]*-[[:space:]]+\|[[:space:]]*$' "$mon/23-grafana-import-dash-batch.yaml"

        echo "OK: Grafana guards passed"

  # ---------------------------------------------------------------------------
  # 3) Helm chart sanity check (no cluster required).
  #    - `helm lint --strict` catches malformed Chart.yaml, bad values, and
  #      template syntax errors (it is run with --strict so warnings fail too).
  #    - `helm template` renders every template, so we know a bad edit does not
  #      break rendering before it ever reaches a cluster.
  #    - The rendered output is piped through kubeconform to validate the API
  #      schemas, exactly like the manifests-validate job does for the raw
  #      manifests. This keeps the two deploy paths (plain YAML and Helm) equally
  #      verified.
  # ---------------------------------------------------------------------------
  helm-chart-validate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Set up Helm
      uses: azure/setup-helm@v5
      with:
        version: v3.16.1
    - name: Lint Helm chart
      run: helm lint deploy/kubernetes/helm-chart --strict
    - name: Render chart and validate rendered manifests
      run: |
        helm template sock-shop deploy/kubernetes/helm-chart > rendered.yaml
        docker run --rm -v "$PWD:/work" ghcr.io/yannh/kubeconform:latest \
          -strict -summary -ignore-missing-schemas /work/rendered.yaml

  # ---------------------------------------------------------------------------
  # 4) Terraform static checks (no cloud and no Docker required).
  #    - `terraform fmt -check` enforces canonical formatting; the job fails
  #      (with a diff) if a .tf file is not formatted.
  #    - `terraform init -backend=false` downloads the providers without locking
  #      to a remote state backend.
  #    - `terraform validate` then checks syntax, types and provider schema
  #      WITHOUT talking to any real API, so it is safe and fast in CI.
  #    Scoped with working-directory so the legacy AWS config under
  #    deploy/kubernetes/terraform (kept only as a reference) is not checked.
  # ---------------------------------------------------------------------------
  terraform-validate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v4
      with:
        terraform_version: "1.16.5"
    - name: Terraform fmt
      working-directory: terraform/k3d
      run: terraform fmt -check
    - name: Terraform init + validate
      working-directory: terraform/k3d
      run: |
        terraform init -backend=false -input=false
        terraform validate

  # ---------------------------------------------------------------------------
  # 5) Build and push the openapi / healthcheck helper images.
  #
  #    Release-only job: it publishes real images to Docker Hub, so it must NOT
  #    run on every push to the default branch. We deliberately gate it on
  #    version tags (v*) only:
  #      - pushing to a public registry on every commit would spam it with junk
  #        tags and could publish broken images,
  #      - it needs repository secrets (DOCKER_USER / DOCKER_PASS), which are
  #        absent on forks, so it would fail there anyway,
  #      - the usual convention is "verify on every commit, publish on release".
  #    This job is kept for reference; without a v* tag it simply never runs.
  # ---------------------------------------------------------------------------
  build-test-images:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      GROUP: weaveworksdemos
    strategy:
      matrix:
        repo: ["openapi", "healthcheck"]
    steps:
    - uses: actions/checkout@v5
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    - name: Login to DockerHub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKER_USER }}
        password: ${{ secrets.DOCKER_PASS }}
    - name: Build and push
      uses: docker/build-push-action@v7
      with:
        context: ${{ matrix.repo }}
        push: true
        tags: ${{ env.GROUP }}/${{ matrix.repo }}:${{ github.sha }}
