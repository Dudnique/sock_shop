# What runs on the stand, as data. Each entry is one Argo CD Application.
#
# `path` is the directory `deploy.ps1` applies for the same step, and
# `check-apps.py` (run by CI) fails when a directory is applied by the script
# and has no entry here - so the two ways of deploying cannot drift apart.
# `gitopsOnly: true` marks what exists only in this mode (Vault, External
# Secrets and the ExternalSecret objects): the script does not apply it, so the
# gate does not look for it there.

repoURL: https://github.com/Dudnique/sock_shop.git
# Overridden by the root Application (deploy.ps1 -GitRevision).
revision: main

# Optional components: off unless deploy.ps1 -WithAIOps / -WithLoadtest turned
# them on in root-app.yaml.
aiops:
  enabled: false
loadtest:
  enabled: false

# `wave` orders the Applications (lower first). Secrets come first because
# everything else mounts them: Vault, then External Secrets (it brings the CRDs),
# then the ExternalSecret objects; after that the order of deploy.ps1: the
# application and its network policies, then autoscaling and the log and trace
# backends, then monitoring and alerting, then the optional parts.
apps:
  - name: vault
    gitopsOnly: true
    wave: -3
    namespace: vault
    chart:
      repoURL: https://helm.releases.hashicorp.com
      name: vault
      version: 0.34.1
      values:
        # A real (not dev-mode) Vault: one pod, data on a 1 Gi volume (Raft, Vault's
        # built-in storage), sealed after every start. There is no fixed root token:
        # deploy/vault-seed.ps1 initialises it once and keeps the unseal key and the
        # generated root token in deploy/vault-init.local.json (git-ignored), and
        # unseals it again after a restart. One key share because this is one pod on
        # a laptop; in AWS the key is held by KMS (auto-unseal) and nobody unseals by hand.
        server:
          dev:
            enabled: false
          standalone:
            enabled: true
            config: |
              ui = true
              disable_mlock = true
              listener "tcp" {
                tls_disable = 1
                address = "[::]:8200"
                cluster_address = "[::]:8201"
              }
              storage "raft" {
                path = "/vault/data"
              }
              service_registration "kubernetes" {}
          dataStorage:
            enabled: true
            size: 1Gi
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 256Mi}
        # No sidecar injector: External Secrets is the only consumer.
        injector:
          enabled: false
        ui:
          enabled: true
  - name: external-secrets
    gitopsOnly: true
    wave: -2
    namespace: external-secrets
    chart:
      repoURL: https://charts.external-secrets.io
      name: external-secrets
      version: 2.14.0
      values:
        installCRDs: true
        # A Service for the metrics port, annotated the way the existing
        # `kubernetes-service-endpoints` job of Prometheus looks for targets, so the
        # ExternalSecretNotReady rule has a series to read.
        metrics:
          service:
            enabled: true
            annotations:
              prometheus.io/scrape: "true"
              prometheus.io/port: "8080"
        resources:
          requests: {cpu: 20m, memory: 48Mi}
          limits: {memory: 192Mi}
        webhook:
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
        certController:
          resources:
            requests: {cpu: 10m, memory: 48Mi}
            limits: {memory: 128Mi}
    # The cert controller writes the webhook CA bundle into the CRDs and the
    # webhook configurations after install; without this Argo CD sees that as
    # drift and fights it forever.
    ignoreDifferences:
      - group: apiextensions.k8s.io
        kind: CustomResourceDefinition
        jqPathExpressions:
          - .spec.conversion.webhook.clientConfig.caBundle
      - group: admissionregistration.k8s.io
        kind: ValidatingWebhookConfiguration
        jqPathExpressions:
          - .webhooks[].clientConfig.caBundle
  - name: secrets
    gitopsOnly: true
    path: deploy/kubernetes/manifests-secrets
    namespace: monitoring
    wave: -1
  - name: sock-shop
    path: deploy/kubernetes/helm-chart
    namespace: sock-shop
    wave: 0
    helm: true
    # The HPAs own `spec.replicas`. Without this Argo CD sees every scaled
    # Deployment as drift and, with selfHeal, scales it back - a fight with the
    # autoscaler that the chart's own install already hit with Helm (FIXES 25).
    ignoreDifferences:
      - group: apps
        kind: Deployment
        jsonPointers:
          - /spec/replicas
  - name: network-policies
    path: deploy/kubernetes/manifests-policy
    namespace: sock-shop
    wave: 0
  - name: autoscaling
    path: deploy/kubernetes/autoscaling
    namespace: sock-shop
    wave: 1
  - name: logging
    path: deploy/kubernetes/manifests-logging
    namespace: logging
    wave: 1
  - name: tracing
    path: deploy/kubernetes/manifests-jaeger
    namespace: jaeger
    wave: 1
  - name: monitoring
    path: deploy/kubernetes/manifests-monitoring
    namespace: monitoring
    wave: 2
  - name: alerting
    path: deploy/kubernetes/manifests-alerting
    namespace: monitoring
    wave: 2
  - name: aiops
    path: deploy/kubernetes/manifests-aiops
    namespace: monitoring
    wave: 3
    flag: aiops
  - name: loadtest
    path: deploy/kubernetes/manifests-loadtest
    namespace: loadtest
    wave: 3
    flag: loadtest
