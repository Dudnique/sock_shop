---
# HPA v2 for queue-master (CPU 50% of requests.cpu, 1..5 replicas). Rationale
# and the verification recipe: README.md in this directory.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: queue-master
  namespace: sock-shop
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: queue-master
  minReplicas: 1
  # 2, not the 1..5 the light services use: `queue-master` is a JVM service and
  # each pod settles at ~320 MiB RSS. Five replicas here and on the other three
  # Java services (carts, orders, shipping) is 20 JVMs ~6.4 GB on a 9.7 GB
  # Docker VM - measured, see "Why these numbers" in README.md.
  maxReplicas: 2
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 120
      policies:
        - type: Pods
          value: 2
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60

