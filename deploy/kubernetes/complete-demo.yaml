apiVersion: v1
kind: Service
metadata:
  name: queue-master
  # No prometheus.io/scrape here on purpose. queue-master is the one Java service
  # in this stack that exposes Spring Boot Actuator metrics as JSON
  # ({"mem":...,"heap.used":...}) on /metrics and has NO Prometheus endpoint
  # (/actuator/prometheus -> 404), so scraping it could only ever produce a
  # permanently DOWN target. It used to be announced as scrapable, which made
  # Prometheus report "expected a valid start token, got \"{\"" forever - a
  # broken target nobody noticed until a ScrapeTargetDown rule was added.
  labels:
    name: queue-master
  namespace: sock-shop
spec:
  ports:
    # the port that this service should serve on
  - port: 80
    targetPort: 80
  selector:
    name: queue-master
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  labels:
    name: rabbitmq
  namespace: sock-shop
spec:
  replicas: 1
  selector:
    matchLabels:
      name: rabbitmq
  template:
    metadata:
      labels:
        name: rabbitmq
      annotations:
        prometheus.io/scrape: "false"
    spec:
      containers:
      - name: rabbitmq
        # 3.13.7, not 3.6.8: that image is from 2016 and its management plugin is
        # broken on this kernel - every /api/* call answers 500, with
        # `rabbit_mgmt_stats:rate_from_difference/2` raising `badarith` in a loop
        # (see FIXES.md section 24). AMQP itself kept working, so the only symptom
        # was that the exporter below had nothing to read and rabbitmq_queues,
        # rabbitmq_queue_messages_ready and rabbitmq_connections did not exist.
        # 3.13.7 is the current 3.x line; the AMQP contract queue-master uses
        # (one queue, one consumer) is unchanged by the upgrade.
        image: rabbitmq:3.13.7-management
        ports:
        - containerPort: 15672
          name: management
        - containerPort: 5672
          name: rabbitmq
        securityContext:
          capabilities:
            drop:
              - all
            add:
              - CHOWN
              - SETGID
              - SETUID
              - DAC_OVERRIDE
          readOnlyRootFilesystem: true
      - name: rabbitmq-exporter
        # Pinned, unlike before: `latest` was the only floating tag left on the
        # stand, and a scraper that silently changes version changes the metric
        # names the dashboard and the alert rules are written against. 1.0.0 is
        # the current release of kbudde/rabbitmq-exporter.
        image: kbudde/rabbitmq-exporter:1.0.0
        # The image listens on 9419 by default (PUBLISH_PORT=9419), while this
        # file, 20-rabbitmq-svc.yaml and the prometheus.io/port annotation all
        # announce 9090. That mismatch made every scrape of the rabbitmq Service
        # fail with "connection refused" - a permanently DOWN target, invisible
        # until a ScrapeTargetDown rule was added. Pin the exporter to the port
        # the rest of the manifests promise.
        env:
        - name: PUBLISH_PORT
          value: "9090"
        ports:
        - containerPort: 9090
          name: exporter
      nodeSelector:
        kubernetes.io/os: linux
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '9090'
  labels:
    name: rabbitmq
  namespace: sock-shop
spec:
  ports:
    # the port that this service should serve on
  - port: 5672
    name: rabbitmq
    targetPort: 5672
  - port: 9090
    name: exporter
    targetPort: exporter
    protocol: TCP
  selector:
    name: rabbitmq
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: session-db
  labels:
    name: session-db
  namespace: sock-shop
spec:
  replicas: 1
  selector:
    matchLabels:
      name: session-db
  template:
    metadata:
      labels:
        name: session-db
      annotations:
        prometheus.io.scrape: "false"
    spec:
      containers:
      - name: session-db
        image: redis:alpine
        ports:
        - name: redis
          containerPort: 6379
        securityContext:
          capabilities:
            drop:
              - all
            add:
              - CHOWN
              - SETGID
              - SETUID
          readOnlyRootFilesystem: true
        # Redis keeps its working directory in /data (`CONFIG GET dir`) and that
        # is where it writes its RDB snapshot. The mongo images on this stand get
        # such a directory for free: their `VOLUME /data/db` turns into an
        # anonymous writable mount (`/proc/mounts` of carts-db shows
        # `/dev/sdd /data/db ext4 rw`). The redis image declares no volume, so
        # with `readOnlyRootFilesystem: true` the first `BGSAVE` logged
        # "Failed opening the temp RDB file ... Read-only file system", redis set
        # `stop-writes-on-bgsave-error` and then answered EVERY write with
        # `MISCONF`. Nobody could log in (the session store is Redis), so no order
        # was ever placed - while the stand still looked Ready (see FIXES.md, 25).
        # An emptyDir, not a PVC: on a stand whose data is disposable by design a
        # session DB that survives a pod restart would be the only stateful thing.
        volumeMounts:
        - mountPath: /data
          name: data-volume
      volumes:
        - name: data-volume
          emptyDir: {}
      nodeSelector:
        kubernetes.io/os: linux
---
apiVersion: v1
kind: Service
metadata:
