---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: carts
  labels:
    name: carts
spec:
  replicas: 1
  selector:
    matchLabels:
      name: carts
  template:
    metadata:
      labels:
        name: carts
      {{- if .Values.istio.enabled }}
      annotations:
        sidecar.istio.io/rewriteAppHTTPProbers: "true"
      {{- end }}
    spec:
      containers:
      - name: carts
        image: {{if .Values.global.registry}}{{ .Values.global.registry }}/{{end}}{{ .Values.carts.image.repo }}:{{ .Values.carts.image.tag }}
        # No command: `docker inspect weaveworksdemos/carts:0.4.8` shows the
        # ENTRYPOINT is already `/usr/local/bin/java.sh -jar ./app.jar --port=80`,
        # and that script is `java $JAVA_OPTS $*`. Copying the entrypoint into the
        # chart was a second source of truth for the same thing - the manifests
        # rely on the image default, so does this now.
        env:
        - name: JAVA_OPTS
          value: {{ .Values.java.options | quote }}
        resources:
{{ toYaml .Values.carts.resources | indent 10 }}
        ports:
         - containerPort: {{ .Values.carts.containerPort }}
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
{{- if lt (int .Values.carts.containerPort) 1024 }}
          capabilities:
            drop:
              - all
            add:
              - NET_BIND_SERVICE
{{- end }}
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /tmp
          name: tmp-volume
        livenessProbe:
          httpGet:
            path: /health
            port: {{ .Values.carts.containerPort }}
          initialDelaySeconds: 420
          periodSeconds: 3
        readinessProbe:
          httpGet:
            path: /health
            port: {{ .Values.carts.containerPort }}
          initialDelaySeconds: 360
          periodSeconds: 3
      volumes:
        - name: tmp-volume
          emptyDir:
            medium: Memory
