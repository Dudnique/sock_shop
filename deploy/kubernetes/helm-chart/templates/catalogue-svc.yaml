---
apiVersion: v1
kind: Service
metadata:
  name: catalogue
  labels:
    name: catalogue
  annotations:
    prometheus.io/scrape: 'true' # as in manifests/06-catalogue-svc.yaml
spec:
  ports:
    # the port that this service should serve on
  - port: 80
    targetPort: {{ .Values.catalogue.containerPort }}
  selector:
    name: catalogue
