---
apiVersion: v1
kind: Service
metadata:
  name: front-end
  labels:
    name: front-end
  annotations:
    prometheus.io/scrape: 'true' # as in manifests/10-front-end-svc.yaml
spec:
  # ClusterIP: the app is reached through the Ingress (Traefik); no NodePort needed.
  ports:
  - port: 80
    targetPort: 8079
  selector:
    name: front-end
