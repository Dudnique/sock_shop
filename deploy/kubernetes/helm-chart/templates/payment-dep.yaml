---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment
  labels:
    name: payment
spec:
  replicas: 1
  selector:
    matchLabels:
      name: payment
  template:
    metadata:
      labels:
        name: payment
      {{- if .Values.istio.enabled }}
      annotations:
        sidecar.istio.io/rewriteAppHTTPProbers: "true"
      {{- end }}
    spec:
      containers:
      - name: payment
        image: {{if .Values.global.registry}}{{ .Values.global.registry }}/{{end}}{{ .Values.payment.image.repo }}:{{ .Values.payment.image.tag }}
        # No command: manifests/15-payment-dep.yaml passes nothing, so the binary
        # runs with its own default. The chart used to force `-decline=200`, which
        # made the two paths decline at different amounts - a difference that no
        # schema check can see, only a checkout over the threshold.
        resources:
{{ toYaml .Values.payment.resources | indent 10 }}
        ports:
        - containerPort: {{ .Values.payment.containerPort }}
        env:
        - name: ZIPKIN
          value: {{ .Values.zipkin.endpoint | quote }}
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
{{- if lt (int .Values.payment.containerPort) 1024 }}
          capabilities:
            drop:
              - all
            add:
              - NET_BIND_SERVICE
{{- end }}
          readOnlyRootFilesystem: true
        # Liveness must not kill a healthy pod: upstream's 3 s period with a 1 s
        # timeout and 3 failures restarted four services under the load generator, as
        # one slow /health is enough three times in a row (FIXES.md, section 25).
        livenessProbe:
          httpGet:
            path: /health
            port: {{ .Values.payment.containerPort }}
          initialDelaySeconds: 300
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        readinessProbe:
          httpGet:
            path: /health
            port: {{ .Values.payment.containerPort }}
          initialDelaySeconds: 180
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
