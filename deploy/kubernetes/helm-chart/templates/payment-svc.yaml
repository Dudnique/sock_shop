---
apiVersion: v1
kind: Service
metadata:
  name: payment
  labels:
    name: payment
  annotations:
    prometheus.io/scrape: 'true' # as in manifests/16-payment-svc.yaml
spec:
  ports:
    # the port that this service should serve on
  - port: 80
    targetPort: {{ .Values.payment.containerPort }}
  selector:
    name: payment
