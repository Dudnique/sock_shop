---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shipping
  labels:
    name: shipping
spec:
  replicas: 1
  selector:
    matchLabels:
      name: shipping
  template:
    metadata:
      labels:
        name: shipping
    spec:
      containers:
      - name: shipping
        image: {{if .Values.global.registry}}{{ .Values.global.registry }}/{{end}}{{ .Values.shipping.image.repo }}:{{ .Values.shipping.image.tag }}
        # No command: the image entrypoint already ends in --port=80 and the
        # manifests run it that way (see carts-dep.yaml for the `docker inspect`).
        env:
        # A bare host, no scheme and no path - deliberately identical to
        # manifests/23-shipping-dep.yaml. Shipping's JAVA_OPTS disable Spring's
        # zipkin reporter, so the value cannot take effect; it is mirrored so the
        # two paths describe the same pod.
        - name: ZIPKIN
          value: {{ .Values.zipkin.shippingEndpoint | quote }}
        - name: JAVA_OPTS
          value: {{ .Values.java.options | quote }}
        resources:
{{ toYaml .Values.shipping.resources | indent 10 }}
        ports:
        - containerPort: {{ .Values.shipping.containerPort }}
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
{{- if lt (int .Values.shipping.containerPort) 1024 }}
          capabilities:
            drop:
              - all
            add:
              - NET_BIND_SERVICE
{{- end }}
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /tmp
          name: tmp-volume
        # Liveness must not kill a healthy pod: upstream's 3 s period with a 1 s
        # timeout and 3 failures restarted four services under the load generator, as
        # one slow /health is enough three times in a row (FIXES.md, section 25).
        livenessProbe:
          httpGet:
            path: /health
            port: {{ .Values.shipping.containerPort }}
          initialDelaySeconds: 420
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        readinessProbe:
          httpGet:
            path: /health
            port: {{ .Values.shipping.containerPort }}
          initialDelaySeconds: 360
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
      volumes:
        - name: tmp-volume
          emptyDir:
            medium: Memory

