---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user
  labels:
    name: user
spec:
  replicas: 1
  selector:
    matchLabels:
      name: user
  template:
    metadata:
      labels:
        name: user
      {{- if .Values.istio.enabled }}
      annotations:
        sidecar.istio.io/rewriteAppHTTPProbers: "true"
      {{- end }}
    spec:
      containers:
      - name: user
        image: {{if .Values.global.registry}}{{ .Values.global.registry }}/{{end}}{{ .Values.user.image.repo }}:{{ .Values.user.image.tag }}
        # No command, no args: manifests/25-user-dep.yaml runs the image as-is and
        # configures the database through the environment. The chart used to pass
        # -port, -database and -mongo-host (the last one with the release namespace
        # spliced in) *and* set a MONGO_HOST variable - two ways to say the same
        # thing, and the one that differs between namespaces was the one being used.
        # `mongo` is the variable the manifests set and the one the stand runs on.
        resources:
{{ toYaml .Values.user.resources | indent 10 }}
        ports:
        - containerPort: {{ .Values.user.containerPort }}
        env:
        - name: mongo
          value: user-db:27017
        - name: ZIPKIN
          value: {{ .Values.zipkin.endpoint | quote }}
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
{{- if lt (int .Values.user.containerPort) 1024 }}
          capabilities:
            drop:
              - all
            add:
              - NET_BIND_SERVICE
{{- end }}
          readOnlyRootFilesystem: true
        livenessProbe:
          httpGet:
            path: /health
            port: {{ .Values.user.containerPort }}
          initialDelaySeconds: 300
          periodSeconds: 3
        readinessProbe:
          httpGet:
            path: /health
            port: {{ .Values.user.containerPort }}
          initialDelaySeconds: 180
          periodSeconds: 3
