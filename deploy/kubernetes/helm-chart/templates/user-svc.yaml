---
apiVersion: v1
kind: Service
metadata:
  name: user
  labels:
    name: user
  annotations:
    prometheus.io/scrape: 'true' # as in manifests/26-user-svc.yaml
spec:
  ports:
    # the port that this service should serve on
  - port: 80
    targetPort: {{ .Values.user.containerPort }}
  selector:
    name: user
