# Default values for sock-shop.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.
#
# `replicas`, `resources` and the container image here must describe the same pod
# as `manifests/`: the chart is the same objects written a second time, and CI
# compares the two with `check-parity.py`. These numbers are the measured ones -
# the four JVM services used to request 2000Mi each in this file, i.e. ~10 GiB of
# requests for a stand that has 8 GB of memory in total.
global:
    registry: ''

java:
    options: -Xms64m -Xmx128m -XX:PermSize=32m -XX:MaxPermSize=64m -XX:+UseG1GC -Djava.security.egd=file:/dev/urandom

istio:
    enabled: false

ingress:
    className: traefik
    annotations:
        prometheus.io/probe: "true"
    labels: {}
    host: ''
    tlsSecretName: ''

cartsdb:
    image:
        repo: mongo
        tag: 4.4.0
    # Empty on purpose: manifests/06-carts-db-dep.yaml sets no requests or limits on
    # the datastores, and the chart has to describe the same pods. Requests are not
    # free - the scheduler admits pods on them, and this stand has 8 GB in total.
    resources: {}
    persistentVolume:
        storageClass: ''
        size: 512Mi

carts:
    image:
        repo: weaveworksdemos/carts
        tag: 0.4.8
    containerPort: 80
    resources:
        limits:
            cpu: 300m
            memory: 500Mi
        requests:
            cpu: 100m
            memory: 200Mi

cataloguedb:
    image:
        repo: weaveworksdemos/catalogue-db
        tag: 0.3.0
    resources: {}

catalogue:
    image:
        repo: weaveworksdemos/catalogue
        tag: 0.3.5
    containerPort: 80
    resources:
        limits:
            cpu: 200m
            memory: 200Mi
        requests:
            cpu: 100m
            memory: 100Mi

frontend:
    replicas: 1
    image:
        repo: weaveworksdemos/front-end
        tag: 0.3.12
    resources:
        limits:
            cpu: 300m
            memory: 1000Mi
        requests:
            cpu: 100m
            memory: 300Mi

loadtest:
    replicas: 2
    enabled: false
    image:
        repo: weaveworksdemos/load-test
        tag: 0.1.1
    resources:
        limits:
            cpu: 300m
            memory: 1000Mi
        requests:
            cpu: 100m
            memory: 300Mi

ordersdb:
    image:
        repo: mongo
        tag: 4.4.0
    resources: {}
    persistentVolume:
        storageClass: ''
        size: 512Mi

orders:
    image:
        repo: weaveworksdemos/orders
        tag: 0.4.7
    containerPort: 80
    resources:
        limits:
            cpu: 500m
            memory: 500Mi
        requests:
            cpu: 100m
            memory: 300Mi

payment:
    image:
        repo: weaveworksdemos/payment
        tag: 0.4.3
    declinePaymentsOverAmount: 200
    containerPort: 8080
    # 99m, not 100m: manifests/15-payment-dep.yaml says 99m and the two paths have
    # to render the same pod, oddity included.
    resources:
        limits:
            cpu: 200m
            memory: 200Mi
        requests:
            cpu: 99m
            memory: 100Mi

queuemaster:
    image:
        repo: weaveworksdemos/queue-master
        tag: 0.3.1
    resources:
        limits:
            cpu: 300m
            memory: 500Mi
        requests:
            cpu: 100m
            memory: 300Mi

rabbitmq:
    image:
        repo: rabbitmq
        tag: 3.6.8
    resources: {}

sessiondb:
    image:
        repo: redis
        tag: alpine
    resources: {}
    persistentVolume:
        storageClass: ''
        size: 512Mi

shipping:
    image:
        repo: weaveworksdemos/shipping
        tag: 0.4.8
    containerPort: 80
    resources:
        limits:
            cpu: 300m
            memory: 500Mi
        requests:
            cpu: 100m
            memory: 300Mi

userdb:
    image:
        repo: weaveworksdemos/user-db
        tag: 0.4.0
    resources: {}

user:
    image:
        repo: weaveworksdemos/user
        tag: 0.4.7
    containerPort: 80
    resources:
        limits:
            cpu: 300m
            memory: 200Mi
        requests:
            cpu: 100m
            memory: 100Mi

zipkincron:
    image:
        repo: openzipkin/zipkin-dependencies
        tag: 1.4.0
    resources:
        limits:
            cpu: 300m
            memory: 1000Mi
        requests:
            cpu: 100m
            memory: 300Mi

zipkin:
    image:
        repo: openzipkin/zipkin
        tag: 2.21
    resources:
        limits:
            cpu: 300m
            memory: 1000Mi
        requests:
            cpu: 100m
            memory: 300Mi
    enabled:  false
    url: zipkin.zipkin.svc.cluster.local

zipkinmysql:
    image:
        repo: openzipkin/zipkin-mysql
        tag: 1.20.0
    resources:
        requests:
            memory: 256Mi
            cpu: 250m
        limits:
            memory: 768Mi
            cpu: 1
