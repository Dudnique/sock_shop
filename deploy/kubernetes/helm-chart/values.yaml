# Default values for sock-shop.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.
#
# `replicas`, `resources` and the container image here must describe the same pod
# as `manifests/`: the chart is the same objects written a second time, and CI
# compares the two with `check-parity.py`. These numbers are the measured ones -
# the four JVM services used to request 2000Mi each in this file, i.e. ~10 GiB of
# requests for a stand that has 8 GB of memory in total.
global:
    registry: ''

java:
    # Byte-identical to the JAVA_OPTS in manifests/, i.e. to what the stand
    # actually runs. Measured on the image (weaveworksdemos/carts:0.4.8, OpenJDK
    # 8u111): the chart used to add -XX:PermSize=32m -XX:MaxPermSize=64m and the
    # JVM answers "ignoring option ...; support was removed in 8.0" - harmless,
    # but a different pod for no benefit. The flag the chart was missing is the
    # one that matters: without -Dspring.zipkin.enabled=false Spring's reporter
    # keeps trying to POST spans to localhost:9411 inside the pod, where nothing
    # listens.
    options: -Xms64m -Xmx128m -XX:+UseG1GC -Djava.security.egd=file:/dev/urandom -Dspring.zipkin.enabled=false

istio:
    enabled: false

ingress:
    className: traefik
    annotations:
        prometheus.io/probe: "true"
    labels: {}
    host: ''
    tlsSecretName: ''

cartsdb:
    image:
        repo: mongo
        tag: 4.4.0
    # Empty on purpose: manifests/06-carts-db-dep.yaml sets no requests or limits on
    # the datastores, and the chart has to describe the same pods. Requests are not
    # free - the scheduler admits pods on them, and this stand has 8 GB in total.
    resources: {}
    persistentVolume:
        storageClass: ''
        size: 512Mi

carts:
    image:
        repo: weaveworksdemos/carts
        tag: 0.4.8
    containerPort: 80
    resources:
        limits:
            cpu: 300m
            memory: 500Mi
        requests:
            cpu: 100m
            memory: 200Mi

cataloguedb:
    image:
        repo: weaveworksdemos/catalogue-db
        tag: 0.3.0
    resources: {}

catalogue:
    image:
        repo: weaveworksdemos/catalogue
        tag: 0.3.5
    containerPort: 80
    resources:
        limits:
            cpu: 200m
            memory: 200Mi
        requests:
            cpu: 100m
            memory: 100Mi

frontend:
    replicas: 1
    image:
        repo: weaveworksdemos/front-end
        tag: 0.3.12
    resources:
        limits:
            cpu: 300m
            memory: 1000Mi
        requests:
            cpu: 100m
            memory: 300Mi

ordersdb:
    image:
        repo: mongo
        tag: 4.4.0
    resources: {}
    persistentVolume:
        storageClass: ''
        size: 512Mi

orders:
    image:
        repo: weaveworksdemos/orders
        tag: 0.4.7
    containerPort: 80
    resources:
        limits:
            cpu: 500m
            memory: 500Mi
        requests:
            cpu: 100m
            memory: 300Mi

payment:
    image:
        repo: weaveworksdemos/payment
        tag: 0.4.3
    declinePaymentsOverAmount: 200
    # ^ kept for compatibility with upstream values files, but nothing reads it:
    # the deployment passes no -decline at all, exactly like the manifests. The
    # image's own default is what runs (see payment-dep.yaml).
    # 80, not 8080: 8080 is the port the chart *assumed*, and it is not the one
    # the image uses. Measured inside the running pod - /proc/net/tcp6 has a
    # single listening socket on :0050 (80) and nothing on :1F90 (8080) - and
    # manifests/15-payment-dep.yaml agrees, Service and probes included. With
    # 8080 the chart's Service had no backend at all, so the checkout path would
    # have broken on the first `-Helm` run. The template adds NET_BIND_SERVICE
    # when the port is below 1024, which is how a non-root container binds it.
    containerPort: 80
    # 99m, not 100m: manifests/15-payment-dep.yaml says 99m and the two paths have
    # to render the same pod, oddity included.
    resources:
        limits:
            cpu: 200m
            memory: 200Mi
        requests:
            cpu: 99m
            memory: 100Mi

queuemaster:
    image:
        repo: weaveworksdemos/queue-master
        tag: 0.3.1
    resources:
        limits:
            cpu: 300m
            memory: 500Mi
        requests:
            cpu: 100m
            memory: 300Mi

rabbitmq:
    image:
        # -management, not the bare image: the tag is what enables the plugin
        # behind the :15672 HTTP API and UI. manifests/19-rabbitmq-dep.yaml has
        # always run this tag, and the exporter below scrapes that API - with
        # the bare image there would be nothing to scrape.
        #
        # 3.13.7, not 3.6.8: the 2016 management plugin is broken on this kernel.
        # Every /api/* call answers 500 (`badarith` in
        # `rabbit_mgmt_stats:rate_from_difference/2`, see FIXES.md section 24),
        # so `/api/overview` was dead while AMQP kept working - the queue was
        # fine, only the statistics were not. The upgrade is the reason the
        # rabbitmq_* panels and the queue depth alert can be trusted at all.
        repo: rabbitmq
        tag: 3.13.7-management
    # The same sidecar as manifests/19-rabbitmq-dep.yaml: it reads the management
    # API on localhost:15672 and publishes Prometheus metrics on 9090, which is
    # the port the Service annotation advertises. Pinned to 1.0.0 on both sides:
    # `latest` was the last floating tag on the stand, and a scraper that changes
    # version changes metric names the dashboard and the alert rules depend on.
    exporter:
        repo: kbudde/rabbitmq-exporter
        tag: 1.0.0
    resources: {}

sessiondb:
    image:
        repo: redis
        tag: alpine
    resources: {}
    persistentVolume:
        storageClass: ''
        size: 512Mi

shipping:
    image:
        repo: weaveworksdemos/shipping
        tag: 0.4.8
    containerPort: 80
    resources:
        limits:
            cpu: 300m
            memory: 500Mi
        requests:
            cpu: 100m
            memory: 300Mi

userdb:
    image:
        repo: weaveworksdemos/user-db
        tag: 0.4.0
    resources: {}

user:
    image:
        repo: weaveworksdemos/user
        tag: 0.4.7
    containerPort: 80
    resources:
        limits:
            cpu: 300m
            memory: 200Mi
        requests:
            cpu: 100m
            memory: 100Mi

zipkincron:
    image:
        repo: openzipkin/zipkin-dependencies
        tag: 1.4.0
    resources:
        limits:
            cpu: 300m
            memory: 1000Mi
        requests:
            cpu: 100m
            memory: 300Mi

zipkin:
    image:
        repo: openzipkin/zipkin
        tag: 2.21
    resources:
        limits:
            cpu: 300m
            memory: 1000Mi
        requests:
            cpu: 100m
            memory: 300Mi
    # The bundled tracing stack (zipkin + zipkin-mysql + zipkin-cron) - and it
    # stays off, not because tracing is off: the Jaeger instance in namespace
    # `jaeger` runs with COLLECTOR_ZIPKIN_HTTP_PORT=:9411 and publishes a Service
    # alias named `zipkin`, so the application already has a receiver. Enabling
    # this would add a third MySQL and a second collector for data Jaeger stores.
    enabled: false
    # What the tracers receive, byte-identical to manifests/ (catalogue, payment,
    # user). The chart used to build the address from `url:
    # zipkin.zipkin.svc.cluster.local` - a Service that has never existed on this
    # stand - and only when `enabled` was true, which is why no chart pod ever
    # carried a working tracer address.
    endpoint: http://zipkin.jaeger.svc.cluster.local:9411/api/v1/spans
    # shipping is the exception: manifests/23-shipping-dep.yaml gives it a bare
    # host, no scheme and no path, and its JAVA_OPTS disable Spring's zipkin
    # reporter, so that value is inert. Mirrored verbatim - rewriting it would be
    # an untested tracing change, and differing from it would be a difference the
    # parity gate reports.
    shippingEndpoint: zipkin.jaeger.svc.cluster.local

zipkinmysql:
    image:
        repo: openzipkin/zipkin-mysql
        tag: 1.20.0
    resources:
        requests:
            memory: 256Mi
            cpu: 250m
        limits:
            memory: 768Mi
            cpu: 1
