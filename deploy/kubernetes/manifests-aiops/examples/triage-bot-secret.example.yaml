# EXAMPLE ONLY - DO NOT COMMIT A REAL KEY.
#
# You do not create this Secret by hand: `.\deploy.ps1 -WithAIOps` renders it
# client-side from deploy\secrets.local.ps1 (git-ignored) and applies it
# idempotently, so a re-run updates the existing Secret instead of failing.
#
# If you do create it manually, read the key from that same file - never type it
# as a command-line argument, it stays in the shell history:
#
#   . .\deploy\secrets.local.ps1
#   kubectl -n monitoring create secret generic aiops-llm `
#     --from-literal=deepseek_api_key=$env:DEEPSEEK_API_KEY `
#     --dry-run=client -o yaml | kubectl apply -f -
#
# The Deployment mounts this Secret as a file and the bot reads it from
# /etc/aiops/secrets/deepseek_api_key (see LLM_PROVIDERS in triage_bot/config.py
# for the per-provider file names). The mount is `optional: true`, so a stand
# without this Secret still runs: the model tier reports itself unavailable and
# the cascade answers from the ruleset.
#
# The value below is a placeholder showing the shape, not a template to fill in.
apiVersion: v1
kind: Secret
metadata:
  name: aiops-llm
  namespace: monitoring
type: Opaque
stringData:
  deepseek_api_key: "REPLACE_ME"
