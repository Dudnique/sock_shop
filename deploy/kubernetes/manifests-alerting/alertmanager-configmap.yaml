kind: ConfigMap
apiVersion: v1
metadata:
  name: alertmanager
  namespace: monitoring
data:
  config.yml: |-
    global:
      resolve_timeout: 5m

    route:
      # Group alerts so a burst from one service becomes one message, not ten.
      group_by: ['alertname', 'namespace']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h

      # Fallback receiver: only used if NO child route matches.
      receiver: 'telegram'

      routes:
        # Two child routes WITHOUT matchers match every alert, so each alert is
        # delivered to both receivers. `continue: true` on the first makes the
        # evaluation proceed to the next sibling. (Without this, the root
        # receiver would be skipped entirely once a child matched.)
        - receiver: 'telegram'
          continue: true
        - receiver: 'slack'

    receivers:
      # --- Telegram ----------------------------------------------------------
      # The bot token is NOT written inline. Alertmanager reads it from a file
      # mounted from the `alertmanager-secrets` Secret, so no secret ever lives
      # in this ConfigMap or in git.
      - name: 'telegram'
        telegram_configs:
          - bot_token_file: /etc/alertmanager/secrets/telegram_bot_token
            chat_id: 386518761
            parse_mode: 'HTML'
            send_resolved: true
            message: |-
              {{ if eq .Status "firing" }}[FIRING]{{ else }}[RESOLVED]{{ end }} {{ .CommonLabels.alertname }}{{ if .CommonLabels.severity }} [{{ .CommonLabels.severity }}]{{ end }} ({{ .Alerts | len }})
              {{ range .Alerts }}
              {{ .Annotations.summary }}{{ if .Labels.namespace }} [ns: {{ .Labels.namespace }}]{{ end }}{{ if .Labels.deployment }} [deploy: {{ .Labels.deployment }}]{{ end }}{{ if .Labels.pod }} [pod: {{ .Labels.pod }}]{{ end }}
              {{ .Annotations.description }}
              {{ if .Annotations.runbook }}runbook: {{ .Annotations.runbook }}{{ end }}
              {{ end }}

      # --- Slack -------------------------------------------------------------
      # The webhook URL is read from a file mounted from the same Secret.
      # `channel` is intentionally omitted: an incoming webhook already posts
      # to the channel that was chosen when it was created.
      - name: 'slack'
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/slack_webhook_url
            send_resolved: true
            title: '{{ .CommonLabels.alertname }} ({{ .Alerts | len }})'
            text: |-
              {{ range .Alerts }}{{ .Annotations.description }}{{ end }}
