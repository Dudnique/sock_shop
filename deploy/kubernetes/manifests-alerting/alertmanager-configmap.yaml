kind: ConfigMap
apiVersion: v1
metadata:
  name: alertmanager
  namespace: monitoring
data:
  config.yml: |-
    global:
      resolve_timeout: 5m

    route:
      # Group alerts so a burst from one service becomes one message, not ten.
      group_by: ['alertname', 'namespace']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h

      # Fallback receiver: only used if NO child route matches.
      receiver: 'telegram'

      routes:
        # The triage bot goes FIRST, and only for the alerts that opted in with
        # `aiops: "true"` - not for every alert on the stand. `continue: true`
        # keeps the two human receivers below running: a bot that were the only
        # one notified would make an outage of the bot itself silent, which is
        # the exact failure mode this stand is built to avoid. (Without
        # `continue` the two routes below would never be evaluated once this one
        # matched.)
        - receiver: 'aiops-triage'
          matchers:
            - aiops="true"
          continue: true
        # Humans are paged by severity, not by default. A `warning` is something to
        # look at during the day, so it goes to Slack only; a `critical` is an
        # outage and goes to Telegram as well. Before this, every alert of either
        # severity reached both channels, on top of the triage bot's own card.
        # `continue: true` on the Telegram route lets the same critical alert
        # reach the Slack route below; the last route catches every warning.
        - receiver: 'telegram'
          matchers:
            - severity="critical"
          continue: true
        - receiver: 'slack'

    # A slow probe is the same fact as a failed one: a probe that times out is
    # also "slower than 2s", so ProbeFailed and ProbeSlow used to arrive together.
    inhibit_rules:
      - source_matchers:
          - alertname="ProbeFailed"
        target_matchers:
          - alertname="ProbeSlow"
        equal: ['instance']

    receivers:
      # --- Telegram ----------------------------------------------------------
      # The bot token is NOT written inline. Alertmanager reads it from a file
      # mounted from the `alertmanager-secrets` Secret, so no secret ever lives
      # in this ConfigMap or in git.
      - name: 'telegram'
        telegram_configs:
          - bot_token_file: /etc/alertmanager/secrets/telegram_bot_token
            chat_id: 386518761
            parse_mode: 'HTML'
            send_resolved: true
            message: |-
              {{ if eq .Status "firing" }}[FIRING]{{ else }}[RESOLVED]{{ end }} {{ .CommonLabels.alertname }}{{ if .CommonLabels.severity }} [{{ .CommonLabels.severity }}]{{ end }} ({{ .Alerts | len }})
              {{ range .Alerts }}
              {{ .Annotations.summary }}{{ if .Labels.namespace }} [ns: {{ .Labels.namespace }}]{{ end }}{{ if .Labels.deployment }} [deploy: {{ .Labels.deployment }}]{{ end }}{{ if .Labels.pod }} [pod: {{ .Labels.pod }}]{{ end }}
              {{ .Annotations.description }}
              {{ if .Annotations.runbook }}runbook: {{ .Annotations.runbook }}{{ end }}
              {{ end }}

      # --- Slack -------------------------------------------------------------
      # The webhook URL is read from a file mounted from the same Secret.
      # `channel` is intentionally omitted: an incoming webhook already posts
      # to the channel that was chosen when it was created.
      - name: 'slack'
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/slack_webhook_url
            send_resolved: true
            title: '{{ .CommonLabels.alertname }} ({{ .Alerts | len }})'
            text: |-
              {{ range .Alerts }}{{ .Annotations.description }}{{ end }}

      # --- AIOps triage bot ---------------------------------------------------
      # A webhook into the triage bot's Service (manifests-aiops). There is no
      # authentication on purpose and none is needed: the endpoint is a
      # ClusterIP that only a pod of this namespace may reach, which is what
      # 04-triage-bot-netpol.yaml enforces - the network is the credential.
      #
      # `send_resolved: false` is deliberate. The bot triages *firing* incidents;
      # a resolved webhook is answered 200 and recorded as "skipped: resolved",
      # so sending them would only add noise to the bot's own metric
      # `aiops_alerts_skipped{reason="resolved"}`. The humans still get the
      # resolution through the `telegram` receiver above.
      #
      # The bot answers 200 even when a triage step failed, so a model outage
      # cannot turn into an Alertmanager retry storm - the failure is described
      # in the response body and in the log instead.
      - name: 'aiops-triage'
        webhook_configs:
          - url: 'http://triage-bot.monitoring.svc.cluster.local:8080/alert'
            send_resolved: false
