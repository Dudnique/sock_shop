apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: monitoring
  labels:
    app: alertmanager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      name: alertmanager
      labels:
        app: alertmanager
    spec:
      containers:
        - name: alertmanager
          # Pinned: never use :latest for a reproducible stand.
          image: prom/alertmanager:v0.34.1
          args:
            - '--config.file=/etc/alertmanager/config.yml'
            - '--storage.path=/alertmanager'
            # Single replica: disable peer gossip to skip HA/cluster warnings.
            - '--cluster.listen-address='
          ports:
            - name: alertmanager
              containerPort: 9093
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9093
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9093
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: config-volume
              mountPath: /etc/alertmanager
            # Secrets are mounted as files and consumed via `*_file` options.
            - name: secrets
              mountPath: /etc/alertmanager/secrets
              readOnly: true
            - name: storage
              mountPath: /alertmanager
        # Re-reads the config when the ConfigMap changes (a route or a receiver
        # edited in git) and when the Secret changes (a token rotated in Vault and
        # synced by External Secrets): Alertmanager loads both only at start or on
        # POST /-/reload. A config it cannot parse is rejected and the running one
        # stays.
        - name: config-reloader
          image: ghcr.io/jimmidyson/configmap-reload:v0.14.0
          args:
            - '--volume-dir=/etc/alertmanager'
            - '--volume-dir=/etc/alertmanager-secrets'
            - '--webhook-url=http://127.0.0.1:9093/-/reload'
          resources:
            requests: {cpu: 5m, memory: 8Mi}
            limits: {memory: 32Mi}
          volumeMounts:
            - name: config-volume
              mountPath: /etc/alertmanager
              readOnly: true
            - name: secrets
              mountPath: /etc/alertmanager-secrets
              readOnly: true
      volumes:
        - name: config-volume
          configMap:
            name: alertmanager
        - name: secrets
          secret:
            secretName: alertmanager-secrets
        # Silences/notifications state is ephemeral for this stand.
        - name: storage
          emptyDir: {}
      nodeSelector:
        kubernetes.io/os: linux
