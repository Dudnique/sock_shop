apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: monitoring
  labels:
    name: alertmanager
  annotations:
    prometheus.io/scrape: 'true'
    prometheus.io/path: '/alertmanager/metrics'
spec:
  # NodePort so the host can reach it. The port matches the Terraform host
  # mapping `9093:30903` in terraform/k3d/main.tf.
  type: NodePort
  selector:
    app: alertmanager
  ports:
    - name: alertmanager
      protocol: TCP
      port: 9093
      targetPort: 9093
      nodePort: 30903
