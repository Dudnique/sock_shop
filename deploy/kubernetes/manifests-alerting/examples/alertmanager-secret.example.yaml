# EXAMPLE ONLY - DO NOT COMMIT A REAL TOKEN.
#
# Create the real Secret imperatively instead (nothing secret goes to git):
#
#   kubectl -n monitoring create secret generic alertmanager-secrets \
#     --from-literal=telegram_bot_token='<BOT_TOKEN>'
#
# To rotate the token later:
#
#   kubectl -n monitoring create secret generic alertmanager-secrets \
#     --from-literal=telegram_bot_token='<NEW_TOKEN>' \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# When Slack is added, extend the same Secret with another key:
#
#   kubectl -n monitoring create secret generic alertmanager-secrets \
#     --from-literal=telegram_bot_token='<BOT_TOKEN>' \
#     --from-literal=slack_webhook_url='<SLACK_WEBHOOK_URL>' \
#     --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-secrets
type: Opaque
stringData:
  telegram_bot_token: "PASTE_BOT_TOKEN_HERE"
