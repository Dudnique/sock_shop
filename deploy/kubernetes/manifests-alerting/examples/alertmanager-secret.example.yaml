# EXAMPLE ONLY - DO NOT COMMIT A REAL TOKEN.
#
# You do not create this Secret by hand: deploy.ps1 renders it client-side from
# deploy\secrets.local.ps1 (git-ignored) and applies it idempotently, so a re-run
# updates the existing Secret instead of failing.
#
# If you do create it manually, read the values from that same file - never type a
# token as a command-line argument, it stays in the shell history:
#
#   . .\deploy\secrets.local.ps1
#   kubectl -n monitoring create secret generic alertmanager-secrets \
#     --from-literal=telegram_bot_token=$env:TELEGRAM_BOT_TOKEN \
#     --from-literal=slack_webhook_url=$env:SLACK_WEBHOOK_URL \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# The value below is a placeholder showing the shape, not a template to fill in.
apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-secrets
type: Opaque
stringData:
  telegram_bot_token: "REPLACE_ME"
