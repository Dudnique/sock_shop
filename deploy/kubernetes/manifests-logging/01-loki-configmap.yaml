apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: logging
data:
  # Settings file of the log store. It is mounted into the pod at
  # /etc/loki/loki.yaml (see 02-loki-dep.yaml).
  loki.yaml: |
    # A single local stand, not a service shared by many teams, so there is no
    # per-team separation of data.
    auth_enabled: false

    server:
      http_listen_port: 3100
      grpc_listen_port: 9096

    common:
      instance_addr: 127.0.0.1
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      # One replica means one writer - no replication, no distributed ring.
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory

    # Format of the "table of contents" that points at the log data (the index).
    # boltdb-shipper + schema v11 is what the Loki 2.9 documentation recommends
    # when everything runs in one process and stores data on a local disk.
    schema_config:
      configs:
      - from: 2020-10-24
        store: boltdb-shipper
        object_store: filesystem
        schema: v11
        index:
          prefix: index_
          period: 24h

    storage_config:
      boltdb_shipper:
        active_index_directory: /loki/boltdb-shipper-active
        cache_location: /loki/boltdb-shipper-cache
        cache_ttl: 24h
        shared_store: filesystem
      filesystem:
        directory: /loki/chunks

    # Limits: anything older than a week is refused, so a wrong clock or an old
    # volume cannot smuggle ancient log lines in.
    limits_config:
      reject_old_samples: true
      reject_old_samples_max_age: 168h
      allow_structured_metadata: false

    compactor:
      working_directory: /loki/compactor
      shared_store: filesystem

    # Loki is able to run alert rules by itself. We ship none, but the address
    # of our Alertmanager is set here so that adding a rule later needs no extra
    # wiring.
    ruler:
      storage:
        type: local
        local:
          directory: /loki/rules
      rule_path: /loki/rules-temp
      alertmanager_url: http://alertmanager.monitoring.svc.cluster.local:9093
      ring:
        kvstore:
          store: inmemory
      enable_api: true
