apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-alertrules
  namespace: monitoring
data:
  alert.rules: |-
    # Alerting rules for the Sock Shop stand.
    #
    # Design notes:
    #  * Rules are grouped by WHAT THEY PROTECT (availability / application /
    #    infrastructure / meta), not by the metric they happen to use, so severity
    #    and alert routing stay readable.
    #  * A rule only earns its place here if it CAN actually fire on this stand.
    #    That is why blackbox probes and kube-state-metrics carry most of the rules:
    #    both are scraped here (see 04-prometheus-configmap.yaml) and both can be
    #    triggered on purpose - scale a Deployment to 0, kill a pod, fill a disk.
    #  * `severity` drives routing in Alertmanager; `namespace`, `deployment` and
    #    `pod` are carried as labels because the notification text and any later
    #    log/trace lookup (Loki, Jaeger) need them.
    #  * `aiops: "true"` marks the alerts the automated first responder picks up.
    #    The `aiops-triage` receiver in alertmanager-configmap.yaml matches this
    #    label and POSTs the alert to the triage bot (aiops/triage-bot), so every
    #    rule here is expected to carry it - a rule without the label fires into
    #    a void, and `tests/test_coverage.py` fails when one appears.
    groups:
    - name: availability
      rules:
      # blackbox-exporter probes. `probe_success` is 1 when the probe got one of the
      # valid status codes (see 27-blackbox-exporter-configmap.yaml). The front-end
      # Ingress carries `prometheus.io/probe: "true"`, which is what creates the
      # kubernetes-ingresses target these rules read.
      - alert: ProbeFailed
        expr: probe_success == 0
        for: 2m
        labels:
          severity: critical
          namespace: sock-shop
          # `probe_scope` exists on both probe series (measured: `kubernetes-ingresses`
          # carries "ingress", `blackbox-external` carries "external"), and it is what
          # tells the triage bot which layer the probe looks at.
          probe_scope: "{{ $labels.probe_scope }}"
          aiops: "true"
        annotations:
          summary: "Probe failing: {{ $labels.instance }}"
          description: "blackbox-exporter has not received a 2xx for 2m. A real user cannot reach the site."
          runbook: "kubectl -n sock-shop get ingress,svc,pods; kubectl -n sock-shop describe ingress front-end"
      - alert: ProbeSlow
        expr: probe_duration_seconds > 2
        for: 5m
        labels:
          severity: warning
          # Both probes watch the same entry point, which lives in `sock-shop`
          # (measured: the ingress probe series carries kubernetes_namespace=sock-shop),
          # so the namespace is stated rather than inherited.
          namespace: sock-shop
          probe_scope: "{{ $labels.probe_scope }}"
          aiops: "true"
        annotations:
          summary: "Probe slow: {{ $labels.instance }}"
          description: "The endpoint answers, but takes longer than 2s for 5m - users feel this."
    - name: application
      rules:
      - alert: HighErrorRate
        # Needs traffic to be meaningful: generate it with the load test
        # (manifests-loadtest, `.\deploy.ps1 -WithLoadtest`).
        #
        # Scoped to the namespace on purpose. Without the selector this rule also
        # matched `request_duration_seconds_count` from Promtail's own /metrics
        # endpoint in the `logging` namespace - measured: that was the only series
        # of this metric present before the application served its first 500, so an
        # unscoped rule could fire on the logging stack instead of on the shop.
        expr: rate(request_duration_seconds_count{kubernetes_namespace="sock-shop",status_code="500"}[5m]) > 1
        for: 5m
        labels:
          severity: warning
          namespace: sock-shop
          aiops: "true"
        annotations:
          summary: "High HTTP 500 error rate"
          description: "Rate of HTTP 500 responses over 5m: {{ $value }}/s"
      - alert: DeploymentReplicasUnavailable
        # One rule covers both "scaled to 0" and "every pod is crash-looping".
        expr: kube_deployment_status_replicas_available{namespace="sock-shop"} == 0
        for: 3m
        labels:
          severity: critical
          namespace: sock-shop
          deployment: "{{ $labels.deployment }}"
          aiops: "true"
        annotations:
          summary: "deployment/{{ $labels.deployment }} has no available replicas"
          description: "Nothing has been serving this Deployment for 3m. Check: kubectl -n sock-shop describe deploy/{{ $labels.deployment }}"
      - alert: PodCrashLooping
        expr: kube_pod_container_status_waiting_reason{namespace="sock-shop",reason="CrashLoopBackOff"} > 0
        for: 10m
        labels:
          severity: warning
          namespace: sock-shop
          pod: "{{ $labels.pod }}"
          container: "{{ $labels.container }}"
          aiops: "true"
        annotations:
          summary: "pod/{{ $labels.pod }} ({{ $labels.container }}) is in CrashLoopBackOff"
          description: "The container keeps restarting and backing off for 10m. Last logs: kubectl -n sock-shop logs {{ $labels.pod }} -c {{ $labels.container }} --previous"
      - alert: PodRestartFlapping
        expr: increase(kube_pod_container_status_restarts_total{namespace="sock-shop"}[15m]) > 3
        for: 5m
        labels:
          severity: warning
          namespace: sock-shop
          pod: "{{ $labels.pod }}"
          aiops: "true"
        annotations:
          summary: "pod/{{ $labels.pod }} restarted {{ $value }} times in 15m"
          description: "Restarts without CrashLoopBackOff usually mean an OOM kill or a failing liveness probe."
      - alert: RabbitMQDown
        # The broker's own health, not the scrape's: `ScrapeTargetDown` covers a
        # dead exporter. The exporter is scraped by `kubernetes-service-endpoints`
        # (measured label: `kubernetes_name="rabbitmq"`), so `rabbitmq_up` is the
        # management API answering - which is what publish/consume depend on.
        expr: rabbitmq_up{kubernetes_name="rabbitmq"} == 0
        for: 2m
        labels:
          severity: critical
          namespace: sock-shop
          aiops: "true"
        annotations:
          summary: "RabbitMQ broker is down"
          description: "rabbitmq_up=0 for 2m: orders and shipping cannot publish, so checkout fails with a 500 while the rest of the shop still answers."
          runbook: "kubectl -n sock-shop get pod -l name=rabbitmq; kubectl -n sock-shop logs -l name=rabbitmq --tail=100"
      - alert: RabbitMQQueueBacklog
        # Measured under the load test: `sum(rabbitmq_queue_messages_ready)` sits at
        # 0 while queue-master keeps up, so a backlog means the consumer stopped.
        # The threshold is small on purpose - this is a stand, not production.
        expr: sum(rabbitmq_queue_messages_ready) > 100
        for: 5m
        labels:
          severity: warning
          namespace: sock-shop
          aiops: "true"
        annotations:
          summary: "RabbitMQ queues are backing up ({{ $value }} ready messages)"
          description: "Messages are published but not consumed for 5m. Check queue-master first: CrashLoopBackOff, or saturated and not keeping up."
          runbook: "kubectl -n sock-shop logs -l name=queue-master --tail=100; kubectl -n sock-shop get pod -l name=queue-master"
      - alert: RabbitMQAlarm
        # A memory/disk alarm makes the broker refuse publishes while its HTTP API
        # still answers - from the outside the shop just stops creating orders.
        # `or` (not a scalar sum) because either alarm alone is enough.
        expr: (rabbitmq_node_mem_alarm > 0) or (rabbitmq_node_disk_free_alarm > 0)
        for: 1m
        labels:
          severity: critical
          namespace: sock-shop
          aiops: "true"
        annotations:
          summary: "RabbitMQ resource alarm is active"
          description: "The broker is in a memory or disk alarm and blocks publishers. Free space/memory on the node or lower the watermark, then confirm `rabbitmqctl status`."
          runbook: "kubectl -n sock-shop exec deploy/rabbitmq -- rabbitmqctl status; kubectl top node"
    - name: infrastructure
      rules:
      - alert: NodeNotReady
        expr: kube_node_status_condition{condition="Ready",status="true"} == 0
        for: 5m
        labels:
          severity: critical
          node: "{{ $labels.node }}"
          aiops: "true"
        annotations:
          summary: "node/{{ $labels.node }} is NotReady"
          description: "The kubelet stopped reporting. Workloads on that node are being rescheduled."
      - alert: NodeDiskPressure
        expr: kube_node_status_condition{condition="DiskPressure",status="true"} == 1
        for: 10m
        labels:
          severity: warning
          node: "{{ $labels.node }}"
          # Node alerts ARE triaged: the bot's answer for them is always
          # `escalate_human` (see aiops/triage-bot/triage_bot/adapters.py), because
          # "the disk is full" has no safe automated fix - but a human still gets
          # the card, the evidence and the proposal.
          aiops: "true"
        annotations:
          summary: "node/{{ $labels.node }} reports DiskPressure"
          description: "The node is low on disk; image garbage collection and pod eviction may follow."
      - alert: NodeHighCPU
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 90
        for: 10m
        labels:
          severity: warning
          node: "{{ $labels.instance }}"
          aiops: "true"
        annotations:
          summary: "node/{{ $labels.instance }} CPU above 90% for 10m"
          description: "Sustained CPU saturation: pods on this node will get slower."
      - alert: NodeHighMemory
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 90
        for: 10m
        labels:
          severity: warning
          node: "{{ $labels.instance }}"
          aiops: "true"
        annotations:
          summary: "node/{{ $labels.instance }} memory above 90% for 10m"
          description: "Available memory is nearly exhausted; the OOM killer becomes likely."
    - name: meta
      rules:
      - alert: ScrapeTargetDown
        # Any target Prometheus cannot scrape. This is the rule that turns a silent
        # monitoring gap into a visible one.
        expr: up == 0
        for: 5m
        labels:
          severity: warning
          # Triage of this one starts with the question the rule cannot answer:
          # did the target die, or did the scraping die? The bot's tier-0 answer is
          # an escalation, so the card reaches a human instead of staying silent.
          aiops: "true"
        annotations:
          summary: "Prometheus cannot scrape {{ $labels.job }} ({{ $labels.instance }})"
          description: "A target has been down for 5m; its metrics are missing, so other alerts cannot fire either."
      - alert: ConfigReloadFailed
        # Prometheus and Alertmanager now re-read their config by themselves (the
        # config-reloader sidecars). A config or a rule file that does not parse is
        # REJECTED and the previous one keeps running - good, a bad edit does not
        # silence the alerts - but it also means the change in git is not live, and
        # nothing says so. Both servers export the outcome of the last reload.
        # `or` because either server alone is enough.
        expr: (prometheus_config_last_reload_successful == 0) or (alertmanager_config_last_reload_successful == 0)
        for: 2m
        labels:
          severity: warning
          namespace: monitoring
          aiops: "true"
        annotations:
          summary: "{{ $labels.kubernetes_name }} rejected its new configuration"
          description: "The last config reload failed, so the previous configuration is still running and the change that was just synced is NOT live."
          runbook: "kubectl -n monitoring logs deploy/{{ $labels.kubernetes_name }} -c {{ $labels.kubernetes_name }} --tail=20"
      - alert: ExternalSecretNotReady
        # GitOps mode only (deploy.ps1 -GitOps): the Secrets come from Vault through
        # External Secrets. When that stops working - Vault restarted and is empty or
        # sealed, the role is gone - the Secrets already in the cluster keep working
        # (deletionPolicy: Retain), so nothing breaks and nothing says so: they just
        # stop being refreshed, and a rotated token never arrives. External Secrets
        # exports one series per ExternalSecret; `status="False"` is the failing state.
        # On the plain path there is no External Secrets, the series does not exist and
        # this rule stays silent - it costs nothing there.
        expr: externalsecret_status_condition{condition="Ready",status="False"} == 1
        for: 5m
        labels:
          severity: warning
          namespace: monitoring
          aiops: "true"
        annotations:
          summary: "ExternalSecret {{ $labels.namespace }}/{{ $labels.name }} is not syncing"
          description: "The Secret is not being refreshed from Vault. It still holds its last good value, so nothing is broken yet, but a rotated value will not arrive. Usual cause: Vault was restarted (sealed or empty)."
          runbook: "kubectl -n {{ $labels.namespace }} describe externalsecret {{ $labels.name }}; kubectl get clustersecretstore vault; .\\deploy\\vault-seed.ps1"
