apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-deployment
  namespace: monitoring
spec:
  replicas: 1
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
    type: RollingUpdate
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      name: prometheus
      labels:
        app: prometheus
    spec:
      serviceAccount: prometheus
      containers:
      - name: prometheus
        image: prom/prometheus:v2.45.6
        args:
        - '--storage.tsdb.retention=360h'
        - '--config.file=/etc/prometheus/prometheus.yml'
        - '--web.enable-lifecycle'
        ports:
        - name: web
          containerPort: 9090
        volumeMounts:
        - name: config-volume
          mountPath: /etc/prometheus
        - name: alertrules-volume
          mountPath: /etc/prometheus-rules
      # Prometheus reads its config and rule files once, at start. A ConfigMap
      # change (a rule edited in git and synced by Argo CD, or `kubectl apply`)
      # reaches the files in the pod within about a minute, but the process keeps
      # the old rules until it is told to re-read them - the classic "I changed
      # the rule and nothing happened". This sidecar watches both directories and
      # sends POST /-/reload (the server runs with --web.enable-lifecycle) when
      # they change. A rule file that does not parse is rejected by that reload and
      # Prometheus keeps the previous, working rules: a bad edit does not silence
      # the alerts. deploy.ps1 still reloads by hand on the plain path; both are
      # harmless together.
      - name: config-reloader
        image: ghcr.io/jimmidyson/configmap-reload:v0.14.0
        args:
        - '--volume-dir=/etc/prometheus'
        - '--volume-dir=/etc/prometheus-rules'
        - '--webhook-url=http://127.0.0.1:9090/-/reload'
        resources:
          requests: {cpu: 5m, memory: 8Mi}
          limits: {memory: 32Mi}
        volumeMounts:
        - name: config-volume
          mountPath: /etc/prometheus
          readOnly: true
        - name: alertrules-volume
          mountPath: /etc/prometheus-rules
          readOnly: true
      volumes:
      - name: config-volume
        configMap:
          name: prometheus-configmap
      - name: alertrules-volume
        configMap:
          name: prometheus-alertrules
      nodeSelector:
        kubernetes.io/os: linux
