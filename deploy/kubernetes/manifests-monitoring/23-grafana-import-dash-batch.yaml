apiVersion: batch/v1
kind: Job
metadata:
  name: grafana-import-dashboards
  namespace: monitoring
  labels:
    app: grafana
    component: import-dashboards
spec:
  # Retry a few times in case Grafana is briefly unavailable.
  backoffLimit: 10
  template:
    metadata:
      name: grafana-import-dashboards
      labels:
        app: grafana
        component: import-dashboards
    spec:
      # Wait until Grafana actually serves HTTP before importing.
      #
      # NOTE: the original chart used the annotation
      # `pod.beta.kubernetes.io/init-containers` (see legacy/ for the "before"
      # version). Kubernetes stopped honouring that annotation once init
      # containers became a real field (it was removed in 1.20), so the wait
      # silently did nothing and the importer raced Grafana on a fresh install,
      # failing with "Connection refused". It is now a proper initContainers
      # entry, so dashboards/datasources are imported reliably.
      initContainers:
      - name: wait-for-grafana
        image: giantswarm/tiny-tools
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh", "-c"]
        args:
        - >
          until curl -s -f http://grafana/api/health > /dev/null; do
            echo "waiting for grafana to become ready...";
            sleep 2;
          done;
          echo "grafana is ready";
      containers:
      - name: grafana-import-dashboards
        image: giantswarm/tiny-tools
        command: ["/bin/sh", "-c"]
        workingDir: /opt/grafana-import-dashboards
        args:
          - >
            for file in *-datasource.json ; do
              if [ -e "$file" ] ; then
                echo "importing $file" &&
                curl --silent --fail --show-error \
                  --request POST http://admin:admin@grafana/api/datasources \
                  --header "Content-Type: application/json" \
                  --header "Accept: application/json" \
                  --data-binary "@$file" ||
                  echo "(datasource already exists - kept as is)" ;
                echo "" ;
              fi
            done ;
            for file in *-dashboard.json ; do
              if [ -e "$file" ] ; then
                echo "importing $file" &&
                curl --silent --fail --show-error \
                  --request POST http://admin:admin@grafana/api/dashboards/import \
                  --header "Content-Type: application/json" \
                  --header "Accept: application/json" \
                  --data-binary "@$file" ;
                echo "" ;
              fi
            done ;
        volumeMounts:
        - name: config-volume
          mountPath: /opt/grafana-import-dashboards
      restartPolicy: Never
      volumes:
      - name: config-volume
        configMap:
          name: grafana-import-dashboards
