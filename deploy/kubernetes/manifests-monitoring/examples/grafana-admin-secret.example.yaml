# ---------------------------------------------------------------------------
# TEMPLATE ONLY - this file is NOT applied by `kubectl apply -f
# manifests-monitoring`: kubectl is not recursive, so a sub-directory is
# skipped. It documents what the Grafana pods expect to find.
#
# The real Secret is created by deploy.ps1 (it reuses an existing one on
# re-runs, so the password does not change under a running stand). To do it by
# hand instead:
#
#   kubectl -n monitoring create secret generic grafana-admin \
#       --from-literal=admin-user=admin \
#       --from-literal=admin-password='<some-long-random-string>'
#
# NEVER commit a real password. Grafana reads these values only when it
# initialises its own database (emptyDir here), so an edit of the Secret does
# not change the password of a running instance - recreate the pod instead.
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin
  namespace: monitoring
type: Opaque
stringData:
  admin-user: admin
  admin-password: change-me
