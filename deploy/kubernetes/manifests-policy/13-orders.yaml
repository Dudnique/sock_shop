---
# orders: the busiest dependency in the stand - it writes the order, asks
# payment for authorisation, asks shipping for a quote and reads the customer
# from `user`. Its ingress is narrow (the UI) while its egress is wide, because
# that is what a checkout orchestration service really does; a policy that hid
# this would make the architecture look simpler than it is.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: orders
  namespace: sock-shop
spec:
  podSelector:
    matchLabels:
      name: orders
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              name: front-end
      ports:
        - protocol: TCP
          port: 80
  egress:
    - to:
        - podSelector:
            matchLabels:
              name: orders-db
      ports:
        - protocol: TCP
          port: 27017
    - to:
        - podSelector:
            matchLabels:
              name: payment
        - podSelector:
            matchLabels:
              name: shipping
        - podSelector:
            matchLabels:
              name: user
      ports:
        - protocol: TCP
          port: 80
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: orders-db
  namespace: sock-shop
spec:
  podSelector:
    matchLabels:
      name: orders-db
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              name: orders
      ports:
        - protocol: TCP
          port: 27017
