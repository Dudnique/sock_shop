# Where External Secrets reads from: the Vault of this stand.
#
# Authentication is the Kubernetes auth method, so there is no token to store
# anywhere: External Secrets presents the ServiceAccount token of its own pod,
# Vault asks the Kubernetes API (TokenReview) whether that token is real, and
# answers with a short-lived Vault token limited to the `external-secrets` policy
# (read-only, `secret/sock-shop/*`). deploy/vault-seed.ps1 creates that policy and
# the role this refers to.
#
# A ClusterSecretStore rather than a SecretStore: the three Secrets below all
# live in `monitoring`, but a cluster-wide store is what a second namespace would
# need, and it costs nothing here.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault
spec:
  provider:
    vault:
      server: http://vault.vault.svc.cluster.local:8200
      # The KV engine mount; dev mode mounts KV version 2 at `secret/`.
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
