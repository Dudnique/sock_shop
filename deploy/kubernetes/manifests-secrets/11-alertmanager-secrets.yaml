# The Secret `alertmanager-secrets` (Telegram bot token, Slack webhook URL) that
# Alertmanager mounts as files and that the triage bot mounts for its own Telegram
# token. Built from Vault: secret/sock-shop/alerting.
#
# The Alertmanager pod has a config-reloader sidecar that watches this Secret's
# mount, so a token rotated in Vault reaches Alertmanager without a restart: Vault
# -> (within a minute) this Secret -> (within a minute) the mounted file ->
# the sidecar calls /-/reload.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-secrets
  namespace: monitoring
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: alertmanager-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: telegram_bot_token
      remoteRef:
        key: sock-shop/alerting
        property: telegram_bot_token
    - secretKey: slack_webhook_url
      remoteRef:
        key: sock-shop/alerting
        property: slack_webhook_url
