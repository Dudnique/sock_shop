---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: carts-db
  labels:
    name: carts-db
  namespace: sock-shop
spec:
  replicas: 1
  selector:
    matchLabels:
      name: carts-db
  template:
    metadata:
      labels:
        name: carts-db
    spec:
      containers:
      - name: carts-db
        # Pinned, not floating: `mongo` with no tag is `latest`, which on this
        # stand would pull a MongoDB several majors newer than 4.4 on the next
        # image pull - and `mongo:latest` has removed the shell these images are
        # debugged with. The chart pinned 4.4.0 all along; the first `-Helm` run
        # proved that pin works with `weaveworksdemos/carts:0.4.8` (cart add and
        # checkout both succeed on it), so the manifests now say the same thing.
        image: mongo:4.4.0
        ports:
        - name: mongo
          containerPort: 27017
        securityContext:
          capabilities:
            drop:
              - all
            add:
              - CHOWN
              - SETGID
              - SETUID
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /tmp
          name: tmp-volume
      volumes:
        - name: tmp-volume
          emptyDir:
            medium: Memory
      nodeSelector:
        kubernetes.io/os: linux
