---
apiVersion: v1
kind: Service
metadata:
  name: front-end
  annotations:
        prometheus.io/scrape: 'true'
  labels:
    name: front-end
  namespace: sock-shop
spec:
  # ClusterIP: the app is exposed through the Ingress (Traefik) on :8080, so no
  # NodePort is needed. (Was `type: NodePort` with `nodePort: 30001`, from the
  # era before the ingress was added.)
  ports:
  - port: 80
    targetPort: 8079
  selector:
    name: front-end
