---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  labels:
    name: rabbitmq
  namespace: sock-shop
spec:
  replicas: 1
  selector:
    matchLabels:
      name: rabbitmq
  template:
    metadata:
      labels:
        name: rabbitmq
      annotations:
        prometheus.io/scrape: "false"
    spec:
      containers:
      - name: rabbitmq
        image: rabbitmq:3.6.8-management
        ports:
        - containerPort: 15672
          name: management
        - containerPort: 5672
          name: rabbitmq
        securityContext:
          capabilities:
            drop:
              - all
            add:
              - CHOWN
              - SETGID
              - SETUID
              - DAC_OVERRIDE
          readOnlyRootFilesystem: true
      - name: rabbitmq-exporter
        image: kbudde/rabbitmq-exporter
        # The image listens on 9419 by default (PUBLISH_PORT=9419), while this
        # file, 20-rabbitmq-svc.yaml and the prometheus.io/port annotation all
        # announce 9090. That mismatch made every scrape of the rabbitmq Service
        # fail with "connection refused" - a permanently DOWN target, invisible
        # until a ScrapeTargetDown rule was added. Pin the exporter to the port
        # the rest of the manifests promise.
        env:
        - name: PUBLISH_PORT
          value: "9090"
        ports:
        - containerPort: 9090
          name: exporter
      nodeSelector:
        kubernetes.io/os: linux
