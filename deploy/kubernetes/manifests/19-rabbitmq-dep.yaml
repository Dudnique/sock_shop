---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  labels:
    name: rabbitmq
  namespace: sock-shop
spec:
  replicas: 1
  selector:
    matchLabels:
      name: rabbitmq
  template:
    metadata:
      labels:
        name: rabbitmq
      annotations:
        prometheus.io/scrape: "false"
    spec:
      containers:
      - name: rabbitmq
        # 3.13.7, not 3.6.8: that image is from 2016 and its management plugin is
        # broken on this kernel - every /api/* call answers 500, with
        # `rabbit_mgmt_stats:rate_from_difference/2` raising `badarith` in a loop
        # (see FIXES.md section 24). AMQP itself kept working, so the only symptom
        # was that the exporter below had nothing to read and rabbitmq_queues,
        # rabbitmq_queue_messages_ready and rabbitmq_connections did not exist.
        # 3.13.7 is the current 3.x line; the AMQP contract queue-master uses
        # (one queue, one consumer) is unchanged by the upgrade.
        image: rabbitmq:3.13.7-management
        ports:
        - containerPort: 15672
          name: management
        - containerPort: 5672
          name: rabbitmq
        securityContext:
          capabilities:
            drop:
              - all
            add:
              - CHOWN
              - SETGID
              - SETUID
              - DAC_OVERRIDE
          readOnlyRootFilesystem: true
      - name: rabbitmq-exporter
        # Pinned, unlike before: `latest` was the only floating tag left on the
        # stand, and a scraper that silently changes version changes the metric
        # names the dashboard and the alert rules are written against. 1.0.0 is
        # the current release of kbudde/rabbitmq-exporter.
        image: kbudde/rabbitmq-exporter:1.0.0
        # The image listens on 9419 by default (PUBLISH_PORT=9419), while this
        # file, 20-rabbitmq-svc.yaml and the prometheus.io/port annotation all
        # announce 9090. That mismatch made every scrape of the rabbitmq Service
        # fail with "connection refused" - a permanently DOWN target, invisible
        # until a ScrapeTargetDown rule was added. Pin the exporter to the port
        # the rest of the manifests promise.
        env:
        - name: PUBLISH_PORT
          value: "9090"
        ports:
        - containerPort: 9090
          name: exporter
      nodeSelector:
        kubernetes.io/os: linux
