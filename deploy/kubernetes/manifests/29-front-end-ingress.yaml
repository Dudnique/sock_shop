---
# ---------------------------------------------------------------------------
# Ingress для front-end Sock Shop.
#
# k3d/k3s ставит Traefik как Ingress-контроллер по умолчанию.
# Load-balancer k3d пробрасывает хост-порт (по умолчанию 80), который мы
# публикуем при создании кластера, например:
#
#     k3d cluster create sock-shop -p 8079:80@loadbalancer
#
# С этим Ingress магазин доступен с хоста по адресу:
#
#     http://localhost:8079
#
# Ни NodePort, ни `kubectl port-forward` не нужны.
# ---------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: front-end
  namespace: sock-shop
  labels:
    name: front-end
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: front-end
                port:
                  number: 80
