version: '2'

# Local single-machine monitoring stack: Prometheus + node-exporter +
# Alertmanager + Grafana + a one-shot dashboard importer.
#
# Two deliberate choices, both mirroring the Kubernetes stack (see
# deploy/kubernetes/manifests-monitoring/22-grafana-svc.yaml and FIXES.md 12):
#   * every published port binds to 127.0.0.1 explicitly, because `- 3000:3000`
#     means "listen on EVERY interface of the host" (office Wi-Fi included);
#   * Grafana's admin password is NOT in this file: it comes from the
#     environment, and compose refuses to start without it - a fail-fast is
#     better than a well-known default credential on a reachable port.
#
# Usage (see README.md / README.ru.md):
#   $env:GRAFANA_ADMIN_PASSWORD = 's3cret'   # PowerShell
#   export GRAFANA_ADMIN_PASSWORD=s3cret     # bash
#   docker compose -f docker-compose.monitoring.yml up

services:
    prometheus:
        image: prom/prometheus
        container_name: prometheus
        volumes:
          - ./prometheus.yml:/etc/prometheus/prometheus.yml
          - ./alert.rules:/etc/prometheus/alert.rules
        command:
          - '--config.file=/etc/prometheus/prometheus.yml'
          - '--storage.tsdb.path=/prometheus'
          - '--web.console.libraries=/usr/share/prometheus/console_libraries'
          - '--web.console.templates=/usr/share/prometheus/consoles'
        expose:
          - 9090
        ports:
          # 127.0.0.1 is not decoration: without it Docker publishes the port on
          # all interfaces. These UIs have no authentication at all, so they are
          # reachable from this machine only.
          - '127.0.0.1:9090:9090'
        links:
          - alertmanager:alertmanager
    nodeexporter:
        image: quay.io/prometheus/node-exporter:v1.1.2
        container_name: nodeexporter
        volumes:
          - '/:/host:ro,rslave'
        pid: host
        command:
          - '--path.rootfs=/host'
        restart: unless-stopped
        ports:
          - '127.0.0.1:9100:9100'
    alertmanager:
        image: prom/alertmanager
        ports:
          - '127.0.0.1:9093:9093'
        volumes:
          - ./alertmanager.yml:/etc/alertmanager/config.yml
        command:
          - '--config.file=/etc/alertmanager/config.yml'
          - '--storage.path=/alertmanager'
    grafana:
        image: grafana/grafana
        depends_on:
          - prometheus
        ports:
          # Loopback only, same reasoning as the Kubernetes Service: as
          # `3000:3000` it listened on every interface of the host.
          - '127.0.0.1:3000:3000'
        environment:
          # No password in this file. It used to be `foobar` right here, i.e. a
          # credential in git. `${VAR:?msg}` makes compose fail with that
          # message before anything starts.
          - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
          - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD before docker compose up (see README.md)}
          - GF_USERS_ALLOW_SIGN_UP=false
        links:
          - prometheus:prometheus
    importer:
      image: giantswarm/tiny-tools
      depends_on:
        - grafana
      entrypoint: /bin/sh import.sh
      working_dir: /opt/grafana-import-dashboards
      environment:
        # The importer logs in with the same credentials as Grafana itself; they
        # are passed through from the environment, never written into import.sh.
        - GRAFANA_USER=${GRAFANA_ADMIN_USER:-admin}
        - GRAFANA_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD before docker compose up (see README.md)}
      volumes:
        - ./grafana:/opt/grafana-import-dashboards
      links:
        - grafana:grafana
